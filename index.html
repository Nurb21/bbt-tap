<!doctype html><html lang="en"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Nunito",sans-serif;background:#FFF8EA;color:#0B3B82;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 20px 40px}
img.logo{width:230px;height:auto;margin:-20px 0 -24px}
h1{margin:18px 0 2px;font-size:34px;font-weight:900;letter-spacing:-.5px;text-align:center}
p.sub{margin:0 0 28px;font-size:17px;font-weight:700;color:#3d5f94;text-align:center}
.row{display:flex;gap:10px;width:100%;max-width:440px}
a.btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:#fff;border-radius:28px;height:140px;font-size:28px;font-weight:900;box-shadow:0 12px 28px rgba(0,0,0,.20);transition:transform .18s}
a.btn:active{transform:scale(.97)}
a.text{background:linear-gradient(180deg,#2796F3,#0A5BA8)}a.call{background:linear-gradient(180deg,#63BE45,#338B2E)}a.wa{background:linear-gradient(180deg,#2BD366,#128C4B)}
a.wa{margin-top:18px;width:90%;max-width:396px;flex:0 0 auto;height:96px;flex-direction:row;gap:12px;font-size:26px}a.emg{margin-top:18px;width:100%;max-width:440px;flex:0 0 auto;height:100px;flex-direction:row;gap:12px;font-size:26px;background:linear-gradient(180deg,#F05A4F,#B3261E)}
small.note{display:block;text-align:center;color:#7a5a5a;margin-top:10px;font-size:14px;font-weight:700}
#add{margin-top:30px;max-width:440px;width:100%;border:2px dashed #0B3B82;border-radius:20px;padding:16px;text-align:center;background:#fff;font-weight:700}
#add button{font-family:inherit;background:#0B3B82;color:#fff;border:0;border-radius:14px;padding:12px 20px;font-size:18px;font-weight:900}
.ico{font-size:40px}</style></head><body>
<img class="logo" src="logo.png" alt="Baby Boomer Tech">
<h1>Hersh Hiller</h1><p class="sub">IT Specialist</p>
<div class="row">
<a class="btn text" href="sms:+14148106345"><span class="ico">&#9993;&#65039;</span>Text</a>
<a class="btn call" href="tel:+14148106345"><span class="ico">&#128222;</span>Call</a>
</div>
<a class="btn wa" href="https://wa.me/14148106345"><span class="ico">&#128172;</span> WhatsApp</a>
<a class="btn emg" href="tel:+12066878170">&#9888;&#65039; Tech Emergency</a>
<div id="add"><div id="addtxt">Save this to your home screen so you can reach me anytime.</div><div id="addbtn" style="margin-top:10px"></div></div>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
var box=document.getElementById('add'),t=document.getElementById('addtxt'),b=document.getElementById('addbtn'),dp;
if(standalone){box.style.display='none'}
else if(ios){t.innerHTML='To save: tap the <b>Share</b> button &#11014;&#65039; at the bottom, then <b>Add to Home Screen</b>.'}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;b.innerHTML='<button>Add to Home Screen</button>';b.firstChild.onclick=function(){dp.prompt();}});
</script></body></html>
